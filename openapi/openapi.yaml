openapi: "3.0.3"

info:
  title: DesendividAÍ API
  version: "1.0.0"
  description: |
    API REST do agente DesendividAÍ — consolida dívidas via Open Finance e Serasa,
    prioriza por CET e entrega plano personalizado de quitação.

    **Autenticação:** dois esquemas, ambos emitidos pelo IBM API Connect Native OAuth Provider.

    - `channel_oauth2` (client credentials): o **canal** (app/portal BB) gerencia o
      consentimento. Não depende de token do titular, que só existe depois da autorização.
    - `openfinance_oauth2` (Authorization Code + PKCE, FAPI 1.0 Advanced): token **do titular**,
      emitido depois que ele autoriza o consentimento; acessa os dados financeiros.

    | Endpoint | Esquema | Scope |
    |---|---|---|
    | POST /consent | `channel_oauth2` | `consent:write` |
    | GET /consent/callback | — | — (retorno do Authorization Server, validado pelo `state`) |
    | GET /consent/{consentId} | `channel_oauth2` | `consent:read` |
    | DELETE /consent/{consentId} | `channel_oauth2` | `consent:write` |
    | GET /debts | `openfinance_oauth2` | `debts:read` |
    | POST /simulation | `openfinance_oauth2` | `simulation:read` |
    | POST /recommendation | `openfinance_oauth2` | `recommendation:read` |

    `401` e `429` vêm do gateway, antes de a requisição chegar ao backend.

    **Hackathon (sem API Connect):** o backend valida o token do canal nas rotas de
    consentimento: token IAM do IBM Cloud de um Service ID listado em `CHANNEL_IAM_IDS`
    (exigido por padrão com `APP_ENV=production`, ou com `REQUIRE_CHANNEL_AUTH=true`).

    **Códigos de consentimento (403), iguais em `/debts`, `/simulation` e `/recommendation`:**
    `CONSENT_NOT_AUTHORISED` (status diferente de `AUTHORISED` ou sem validade legível),
    `INSUFFICIENT_SCOPE` e `CONSENT_EXPIRED`. `/simulation` e `/recommendation` usam ainda
    `CONSENT_REQUIRED` quando o snapshot não tem consentimento aplicável (inexistente ou de
    outro titular); no `/debts`, consentimento inexistente é `404 CONSENT_NOT_FOUND`.
  contact:
    name: Os Guri da IBM
  license:
    name: Privado — uso interno

servers:
  - url: https://api.bb.com.br/desendividai/v1
    description: Produção (IBM API Connect)
  - url: https://api-sandbox.bb.com.br/desendividai/v1
    description: Sandbox / homologação

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    channel_oauth2:
      type: oauth2
      description: |
        Client credentials do canal (app/portal BB, cliente confidencial registrado no
        API Connect). Usado para criar, consultar e revogar consentimentos.
        No hackathon, sem API Connect: token IAM do IBM Cloud obtido com a API key do Service
        ID do canal (`POST https://iam.cloud.ibm.com/identity/token`), validado pelo backend.
      flows:
        clientCredentials:
          tokenUrl: https://api.bb.com.br/desendividai/v1/oauth/token
          scopes:
            "consent:read":      Consultar status do consentimento
            "consent:write":     Criar e revogar consentimentos
    openfinance_oauth2:
      type: oauth2
      description: |
        OAuth2 Authorization Code com PKCE — Financial-grade API (FAPI) 1.0 Advanced Profile.
        Token do titular, emitido depois que ele autoriza o consentimento.
        O Authorization Server é o IBM API Connect Native OAuth Provider.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.bb.com.br/oauth/authorize
          tokenUrl: https://api.bb.com.br/desendividai/v1/oauth/token
          refreshUrl: https://api.bb.com.br/desendividai/v1/oauth/token
          scopes:
            openid:              Identidade do cliente (obrigatório)
            "debts:read":        Listar dívidas consolidadas
            "simulation:read":   Solicitar simulação de cenários
            "recommendation:read": Obter recomendação de quitação

  # -------------------------------------------------------------------------
  # Schemas reutilizáveis
  # -------------------------------------------------------------------------
  schemas:

    ConsentRequest:
      type: object
      required: [cpf, institutions, scopes]
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "01234567890"
          description: CPF do titular (11 dígitos, sem pontuação)
        institutions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            pattern: '^[a-z0-9_-]{1,32}$'
          example: ["bb", "itau", "bradesco"]
          description: |
            Códigos das instituições autorizadas (Open Finance Brasil). O servidor normaliza
            com trim + minúsculas e recusa valores com 11 dígitos (ignorando - e _).
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: ["debts:read", "simulation:read", "recommendation:read"]
          example: ["debts:read", "simulation:read", "recommendation:read"]
        expiration_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: TTL do consentimento em dias (máx. 365 — BCB Resolução 3/2020)

    ConsentResponse:
      type: object
      required: [consent_id, status, redirect_url, expires_at, created_at]
      properties:
        consent_id:
          type: string
          format: uuid
          example: "c7f3a2d1-8b4e-4c6f-9a0b-123456789abc"
        status:
          type: string
          enum: [AWAITING_AUTHORISATION, AUTHORISED, REJECTED, REVOKED]
          example: AWAITING_AUTHORISATION
        redirect_url:
          type: string
          format: uri
          description: URL para o cliente autorizar o consentimento no portal Open Finance
        expires_at:
          type: string
          format: date-time
          example: "2025-10-01T00:00:00Z"
        created_at:
          type: string
          format: date-time

    ConsentStatusResponse:
      type: object
      description: Status atual de um consentimento (sem campos internos como pseudonym_id ou state_hash)
      required: [consent_id, status, institutions, scopes, created_at, expires_at]
      properties:
        consent_id:
          type: string
          format: uuid
          description: UUID do consentimento
          example: "c7f3a2d1-8b4e-4c6f-9a0b-123456789abc"
        status:
          type: string
          enum: [AWAITING_AUTHORISATION, AUTHORISED, REJECTED, REVOKED]
          example: AUTHORISED
        institutions:
          type: array
          items:
            type: string
          example: ["bb", "itau"]
        scopes:
          type: array
          items:
            type: string
          example: ["debts:read"]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        authorised_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    Debt:
      type: object
      properties:
        debt_id:
          type: string
          format: uuid
        institution:
          type: string
          example: "itau"
        product_type:
          type: string
          enum: [CREDIT_CARD, PERSONAL_LOAN, PAYROLL_LOAN, OVERDRAFT, VEHICLE_LOAN, MORTGAGE]
          example: CREDIT_CARD
        outstanding_balance:
          type: number
          format: double
          example: 4500.00
        cet_annual:
          type: number
          format: double
          description: "Custo Efetivo Total anual (% a.a.) — BCB Resolução 3.517/2007"
          example: 234.5
        monthly_payment:
          type: number
          format: double
          example: 350.00
        remaining_installments:
          type: integer
          example: 14
        priority_rank:
          type: integer
          description: Posição na fila de prioridade (1 = maior CET, quitação urgente)
          example: 1

    DebtListResponse:
      type: object
      properties:
        pseudonym_id:
          type: string
          description: ID pseudonimizado do cliente (HMAC-SHA256) — não expõe CPF
          example: "a3f9c1..."
        snapshot_id:
          type: string
          format: uuid
          description: ID do snapshot financeiro persistido no Cloudant (financial_snapshots)
        total_outstanding:
          type: number
          format: double
          example: 12350.00
        debts:
          type: array
          items:
            $ref: '#/components/schemas/Debt'
        generated_at:
          type: string
          format: date-time

    SimulationRequest:
      type: object
      required: [snapshot_id, monthly_budget]
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: ID do snapshot retornado por GET /debts
        monthly_budget:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000
          example: 1500.00
          description: Orçamento mensal disponível para quitação (R$)

    SimulationScenario:
      type: object
      properties:
        scenario_id:
          type: string
          enum: [aggressive, consolidation, minimum_viable]
        label:
          type: string
          example: "Agressivo"
        description:
          type: string
          example: "Máxima quitação com orçamento disponível, maior CET primeiro"
        total_months:
          type: integer
          example: 18
        total_interest_paid:
          type: number
          format: double
          example: 2340.00
        total_savings_vs_minimum:
          type: number
          format: double
          description: 'Juros pagando só o mínimo contratado (limitado ao orçamento) menos juros do cenário, no mesmo horizonte; pode ser negativo.'
          example: 5200.00
        paid_off:
          type: boolean
          description: 'O cenário quita todas as dívidas. Falso se a simulação foi interrompida (teto de prazo ou divergência do saldo).'
        minimum_payments_total:
          type: number
          format: double
          description: 'Soma dos pagamentos mínimos do mês 1 neste cenário (na consolidação, com a parcela única da linha BB no lugar das dívidas portadas).'
          example: 1203.82
        budget_below_minimums:
          type: boolean
          description: 'O orçamento mensal é menor que minimum_payments_total deste cenário.'
        monthly_plan:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              payments:
                type: array
                items:
                  type: object
                  properties:
                    debt_id:
                      type: string
                      format: uuid
                    amount:
                      type: number
                      format: double

    SimulationResponse:
      type: object
      properties:
        simulation_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/SimulationScenario'
        generated_at:
          type: string
          format: date-time

    RecommendationRequest:
      type: object
      required: [simulation_id]
      properties:
        simulation_id:
          type: string
          format: uuid
        language_level:
          type: string
          enum: [simple, technical]
          default: simple
          description: Nível de linguagem da explicação gerada pelo Granite

    RecommendationResponse:
      type: object
      properties:
        recommendation_id:
          type: string
          format: uuid
        recommended_scenario:
          type: string
          enum: [aggressive, consolidation, minimum_viable]
          example: aggressive
        explanation:
          type: string
          description: Explicação em linguagem simples gerada pelo Granite (LLM)
          example: "Sua dívida mais cara é o cartão de crédito com 234% a.a. Quitá-la em 6 meses economiza R$ 5.200 em juros."
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/SimulationScenario'
        generated_at:
          type: string
          format: date-time
        trace_id:
          type: string
          description: |
            ID do trace da decisão em decision_traces (Cloudant), correlacionado com a trilha de
            auditoria do M4. O envio ao watsonx.governance está pendente.

    ValidationErrorResponse:
      type: object
      description: Erro de validação padrão do FastAPI (fora de /consent*, que responde 400 ErrorResponse)
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items: {}
              msg:
                type: string
              type:
                type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: CONSENT_NOT_FOUND
        message:
          type: string
          example: "Consentimento não encontrado ou expirado."
        request_id:
          type: string
          format: uuid

# ---------------------------------------------------------------------------
# Global security (Bearer token em todos os endpoints)
# ---------------------------------------------------------------------------
security:
  - openfinance_oauth2: [openid]

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Consentimento ──────────────────────────────────────────────────────────
  /consent:
    post:
      operationId: createConsent
      summary: Criar consentimento Open Finance
      description: |
        Inicia o fluxo de consentimento OAuth2/Open Finance.
        Retorna uma `redirect_url` para o cliente autorizar o acesso no portal
        da instituição financeira. O status inicial é `AWAITING_AUTHORISATION`.
      tags: [Consent]
      security:
        - channel_oauth2: ["consent:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        "201":
          description: Consentimento criado, aguardando autorização do cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        "400":
          description: Parâmetros inválidos (INVALID_REQUEST | INVALID_CPF | INVALID_SCOPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token do canal ausente, inválido ou de canal não autorizado (`UNAUTHORIZED`; no hackathon validado pelo backend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Serviço indisponível ou não configurado (SERVICE_UNAVAILABLE | NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /consent/callback:
    get:
      operationId: consentCallback
      summary: Callback OAuth — transição AWAITING_AUTHORISATION → AUTHORISED ou REJECTED
      description: |
        Recebe o retorno do Authorization Server (code ou error).
        No modo sandbox (`OPEN_FINANCE_AUTH_SANDBOX=true`) a transição ocorre
        automaticamente a partir da redirect_url devolvida pelo `POST /consent`.

        **Limitação:** a troca `code → token` (PKCE) e a introspecção ficam no
        IBM API Connect. O backend valida apenas o `state` e persiste o novo status.
      tags: [Consent]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Valor opaco gerado no POST /consent (uso único)
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Código de autorização (Authorization Server aprovou)
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Código de erro (ex. `access_denied`) quando o titular nega
      responses:
        "200":
          description: Autorização concluída — consentimento AUTHORISED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
        "400":
          description: "Parâmetros ausentes: state obrigatório; code ou error obrigatório"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: "CONSENT_AUTHORISATION_EXPIRED | CONSENT_REJECTED"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: State desconhecido, já consumido ou de consentimento vencido apagado pela retenção (CONSENT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Consentimento em estado incompatível com a transição (CONSENT_INVALID_STATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Serviço indisponível (SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /consent/{consentId}:
    get:
      operationId: getConsentStatus
      summary: Status do consentimento
      description: Retorna o status atual do consentimento para o canal acompanhar.
      tags: [Consent]
      security:
        - channel_oauth2: ["consent:read"]
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Status do consentimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
        "400":
          description: UUID inválido (INVALID_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token do canal ausente, inválido ou de canal não autorizado (`UNAUTHORIZED`; no hackathon validado pelo backend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Consentimento não encontrado (CONSENT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Serviço indisponível (SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Rate limit excedido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: revokeConsent
      summary: Revogar consentimento
      description: |
        Revoga o consentimento: `AUTHORISED` → `REVOKED` (retido 90 dias antes da exclusão
        física, política M4). Um consentimento ainda `AWAITING_AUTHORISATION` é cancelado
        (`REJECTED`, `rejection_reason=CUSTOMER_CANCELLED`) e sai na próxima retenção.
        Nenhum dado do cliente poderá ser acessado depois. Já `REVOKED` ou `REJECTED`: 204.
        Conforme LGPD Art. 8º §5 — consentimento pode ser revogado a qualquer tempo.
      tags: [Consent]
      security:
        - channel_oauth2: ["consent:write"]
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Consentimento revogado com sucesso
        "400":
          description: UUID inválido (INVALID_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token do canal ausente, inválido ou de canal não autorizado (`UNAUTHORIZED`; no hackathon validado pelo backend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Consentimento não encontrado (CONSENT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Escritas concorrentes esgotaram as tentativas (CONSENT_INVALID_STATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Serviço indisponível (SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "429":
          description: Rate limit excedido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # ── Dívidas ────────────────────────────────────────────────────────────────
  /debts:
    get:
      operationId: getDebts
      summary: Listar dívidas consolidadas e priorizadas por CET
      description: |
        Aciona o Agente 1 (LangChain + Granite) que coleta dívidas via Open Finance
        e Serasa, calcula o CET de cada uma e retorna o retrato financeiro priorizado.
        Os dados são pseudonimizados antes da persistência no Cloudant.
      tags: [Debts]
      security:
        - openfinance_oauth2: ["debts:read"]
      parameters:
        - name: consent_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID do consentimento AUTHORISED
      responses:
        "200":
          description: Retrato financeiro priorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtListResponse'
        "202":
          description: Processamento em andamento — consulte novamente em alguns segundos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Consentimento não `AUTHORISED` ou sem data de expiração válida (`CONSENT_NOT_AUTHORISED`), sem o escopo `debts:read` (`INSUFFICIENT_SCOPE`) ou expirado (`CONSENT_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Consentimento não encontrado (`CONSENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Erro interno não previsto (`INTERNAL_ERROR`); o detalhe fica apenas no log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: O Agente 1 não completou a coleta (`AGENT_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Open Finance indisponível ou dados inválidos (`SOURCE_UNAVAILABLE`), ou serviço não configurado (`NOT_CONFIGURED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Token ausente ou inválido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Parâmetros fora do formato esperado (validação do FastAPI, corpo `detail`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        "429":
          description: Rate limit excedido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # ── Simulação ──────────────────────────────────────────────────────────────
  /simulation:
    post:
      operationId: runSimulation
      summary: Simular cenários de quitação
      description: |
        Aciona o Motor de Simulação (lógica Python determinística; roda no processo, e como
        AI Service no watsonx.ai quando WATSONX_SIMULATION_URL estiver configurado) e retorna
        3 cenários: **agressivo**, **consolidação** e **mínimo viável**.
      tags: [Simulation]
      security:
        - openfinance_oauth2: ["simulation:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
      responses:
        "200":
          description: Três cenários de simulação calculados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        "400":
          description: Orçamento inválido, snapshot sem dívida em aberto ou dívida malformada (`INVALID_INPUT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Snapshot sem consentimento aplicável — inexistente ou de outro titular (`CONSENT_REQUIRED`); consentimento não `AUTHORISED` (`CONSENT_NOT_AUTHORISED`), expirado (`CONSENT_EXPIRED`) ou sem o escopo `simulation:read` (`INSUFFICIENT_SCOPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Snapshot inexistente ou expirado (`SNAPSHOT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Motor de Simulação indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Token ausente ou inválido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Snapshot inválido (`SNAPSHOT_INVALID`) ou corpo fora do formato (validação do FastAPI, corpo `detail`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        "429":
          description: Rate limit excedido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # ── Recomendação ───────────────────────────────────────────────────────────
  /recommendation:
    post:
      operationId: getRecommendation
      summary: Obter recomendação de quitação em linguagem simples
      description: |
        Aciona o Agente 2 (LangChain + Granite) que analisa os cenários e
        gera uma recomendação em linguagem simples. Cada decisão é registrada em
        decision_traces e na trilha de auditoria do M4; o envio ao watsonx.governance
        está pendente.
      tags: [Recommendation]
      security:
        - openfinance_oauth2: ["recommendation:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        "200":
          description: Recomendação gerada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        "400":
          description: simulation_id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Simulação sem consentimento aplicável — inexistente ou de outro titular (`CONSENT_REQUIRED`); consentimento não `AUTHORISED` (`CONSENT_NOT_AUTHORISED`), expirado (`CONSENT_EXPIRED`) ou sem o escopo `recommendation:read` (`INSUFFICIENT_SCOPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Simulação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Motor de Simulação ou LLM indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Token ausente ou inválido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Parâmetros fora do formato esperado (validação do FastAPI, corpo `detail`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        "429":
          description: Rate limit excedido (gateway)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
